# The same project with two channels instead of the virtual one: the internal
# hosted channel first, then conda-forge by its canonical URL. On the client,
# /etc/pixi/config.toml mirrors https://conda.anaconda.org/conda-forge to the
# registry's proxy, so every byte still comes from ak.internal while pixi.lock
# records conda.anaconda.org URLs (portable across mirrors).
#
# This is what works on Artifact Keeper main today; project/ (one virtual
# channel) is the target design and needs the 1.11.0 virtual-channel fixes.
# Dependency confusion is handled here by client discipline: the internal
# channel is first, priority is strict, and the internal names are pinned.
[workspace]
name = "acme-analytics"
version = "1.0.0"
channels = ["https://ak.internal/conda/conda-internal", "conda-forge"]
platforms = ["linux-64"]
channel-priority = "strict"
exclude-newer = "14d"

[dependencies]
python = "3.12.*"
acme-core = { version = ">=1.0,<2", channel = "https://ak.internal/conda/conda-internal" }
acme-report = { version = ">=1.0,<2", channel = "https://ak.internal/conda/conda-internal" }
acme-fastmath = { version = ">=1.0,<2", channel = "https://ak.internal/conda/conda-internal" }

[exclude-newer]
acme-core = "0d"
acme-report = "0d"
acme-fastmath = "0d"

[pypi-options]
index-url = "https://ak.internal/pypi/pypi-remote/simple"

[pypi-dependencies]
humanize = ">=4"

[tasks]
start = "acme-report"
hypot = "acme-fastmath 3 4"
