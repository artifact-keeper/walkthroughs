# Scenario overlay: Sonatype Nexus Repository (Community Edition, the free
# successor of Nexus OSS) and a small "public" channel we control, both on
# ak-conda-net beside the ak-conda stack. A separate compose project
# (ak-scn-nexus): it never touches ak-conda's containers or volumes.
#   make scenarios-up     scenarios/up.sh: fake-forge files, compose up, AK scn-* repos, Nexus bootstrap
#   make scenarios-down   scenarios/down.sh: compose down (named volume kept)
# By hand: podman compose -p ak-scn-nexus -f scenarios/compose.nexus.yml up -d
#
# nexus:

# - No database container: Community Edition uses its embedded H2 database.
# - Heap: NEXUS_HEAP (default 8g). The image default (2.7 GB) is enough for
#   proxying, but a conda GROUP parses every member's repodata.json into a
#   Jackson tree on the heap: with conda-forge linux-64 (458 MB of JSON) a 2 GB
#   heap died with OutOfMemoryError, which also closed the embedded H2 database
#   (Nexus answered 500 until restarted). 8 GB served the merge; see README.
# - Host port 127.0.0.1:30481 for the bootstrap script and the UI only; clients
#   on ak-conda-net use http://scn-nexus:8081.
# - The internal CA (ak.internal) is added to Nexus's own truststore by
#   bootstrap.sh through the API, not baked into the image.
services:
  nexus:
    image: docker.io/sonatype/nexus3:${NEXUS_VERSION:-3.96.4}
    container_name: scn-nexus
    environment:
      INSTALL4J_ADD_VM_PARAMS: >-
        -Xms1g -Xmx${NEXUS_HEAP:-8g} -XX:MaxDirectMemorySize=1g
        -Djava.util.prefs.userRoot=/nexus-data/javaprefs
    volumes:
      - scn-nexus-data:/nexus-data
    ports:
      - "127.0.0.1:${NEXUS_PORT:-30481}:8081"
    networks: [ak-conda-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/service/rest/v1/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    mem_limit: ${NEXUS_MEM_LIMIT:-12g}

  # fake-forge: http://scn-fake-forge:8000, a static conda channel (busybox
  # httpd) serving scenarios/.work/fake-forge, which scenarios/fake-forge.sh
  # builds: acme-core 99.0.0 (a squatted internal name) and a different file
  # under the exact name of our acme-core 1.0.0. S7 adds a malformed record
  # while it runs. The files are read on every request, so edits need no restart.
  fake-forge:
    image: docker.io/library/busybox:1.37
    container_name: scn-fake-forge
    command: ["httpd", "-f", "-p", "8000", "-h", "/chan"]
    volumes:
      - ./.work/fake-forge:/chan:ro,z
    networks: [ak-conda-net]

volumes:
  scn-nexus-data:
    name: scn-nexus-data

networks:
  ak-conda-net:
    external: true
