# /var is machine-local state in image mode: package-owned directories under /var
# are only unpacked at first install, so declare them for every boot (bootc lint
# var-tmpfiles). RKE2 creates everything below these itself.
d /var/lib/rancher          0755 root root - -
d /var/lib/rancher/rke2     0755 root root - -
d /var/lib/NetworkManager   0700 root root - -
# /opt -> var/opt (see image/Containerfile). /var/opt itself comes from the base's
# rpm-ostree-0-integration-opt-usrlocal.conf; canal's install-cni copies the CNI
# plugins into /opt/cni/bin.
d /var/opt/cni              0755 root root - -
d /var/opt/cni/bin          0755 root root - -
# Persistent journal: journald only writes to /var/log/journal if it exists
# (Storage=auto), and nothing in the base creates it, so previous-boot logs were lost.
d /var/log/journal          2755 root systemd-journal - -
