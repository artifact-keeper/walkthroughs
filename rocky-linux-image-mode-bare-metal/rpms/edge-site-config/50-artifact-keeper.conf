# /etc/containers/registries.conf.d/50-artifact-keeper.conf -- shipped by edge-site-config.
# Artifact Keeper (the edge fleet's registry) serves plain HTTP on the host;
# 10.0.2.2 is the host as seen from a QEMU user-net VM. Needed for `bootc upgrade`
# / `bootc switch` (containers-image) to talk to it.
[[registry]]
location = "10.0.2.2:30080"
insecure = true
