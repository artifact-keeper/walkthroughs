# System-wide uv configuration for the agent sandbox (/etc/uv/uv.toml).
# One index: the registry's PyPI virtual. first-index: a name found on this index is never
# looked up anywhere else (uv's default, stated explicitly).
index-strategy = "first-index"
# Wheels only: never build a source distribution (that would run its build code).
# Every package in app/uv.lock and internal/build-constraints.txt has a wheel.
no-build = true

[[index]]
name = "ak"
url = "https://ak.internal/pypi/pypi-virtual/simple/"
default = true
# Credentials: UV_INDEX_AK_USERNAME (set in the image) and UV_INDEX_AK_PASSWORD (the agent's
# token, at run time). Nothing is written to pyproject.toml or uv.lock.
